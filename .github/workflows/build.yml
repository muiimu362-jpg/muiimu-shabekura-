name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  server:
    name: サーバーを公開
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: zip を展開（いちばん新しくアップロードした zip を使う）
        shell: bash
        run: |
          ZIP=$(git log --format= --name-only --diff-filter=AM -- '*.zip' | grep -m1 . || true)
          echo "使う zip: $ZIP"
          if [ -n "$ZIP" ] && [ -f "$ZIP" ]; then
            rm -rf /tmp/src && unzip -q -o "$ZIP" -d /tmp/src
            cp -r /tmp/src/muiimu-shabekura/. .
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cloudflare にデプロイ
        id: deploy
        shell: bash
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm install --no-audit --no-fund
          npx wrangler deploy 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1 || true)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          if [ -n "$OWNER_PASSWORD" ]; then
            printf '%s' "$OWNER_PASSWORD" | npx wrangler secret put OWNER_PASSWORD
          fi

  apk:
    name: アプリ(APK)を作る
    needs: server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: zip を展開（いちばん新しくアップロードした zip を使う）
        shell: bash
        run: |
          ZIP=$(git log --format= --name-only --diff-filter=AM -- '*.zip' | grep -m1 . || true)
          echo "使う zip: $ZIP"
          if [ -n "$ZIP" ] && [ -f "$ZIP" ]; then
            rm -rf /tmp/src && unzip -q -o "$ZIP" -d /tmp/src
            cp -r /tmp/src/muiimu-shabekura/. .
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: ビルド
        shell: bash
        working-directory: android
        run: |
          URL="${{ needs.server.outputs.url }}"
          if [ -z "$URL" ]; then URL="${{ vars.SERVER_URL }}"; fi
          gradle assembleRelease --no-daemon -PSERVER_URL="$URL" -PVERSION_CODE=${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk ../MuiimuShabekura.apk
          cp app/build/outputs/apk/release/app-release.apk ../MuiimuShabekura-v1.0.${{ github.run_number }}.apk
      - name: リリースに置く
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: むいいむ しゃべくら v1.0.${{ github.run_number }}
          files: |
            MuiimuShabekura.apk
            MuiimuShabekura-v1.0.${{ github.run_number }}.apk
          make_latest: true
